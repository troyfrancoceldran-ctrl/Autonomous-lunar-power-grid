; PlatformIO project for the B03 hardware-in-the-loop bridge.
;
;   .venv/bin/pio run -d firmware --target upload
;   .venv/bin/pio device monitor -p /dev/cu.usbserial-0001 -b 115200
;
; The board is an ESP32-D0WD-V3 rev 3.1 behind a CP2102 bridge, identified with
; esptool on 2026-09-15. `esp32dev` matches it exactly on MCU, clock, flash and
; RAM.
;
; framework = arduino is used for ONE file, src/main.cpp, which owns the serial
; link. The controller itself includes no framework header, so it also compiles
; natively under firmware/CMakeLists.txt and is held to the Python original's
; decisions before anything is flashed. That boundary is the point: the claim
; is "the same controller, on hardware", and it has to be checkable.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
; The ESP32 Arduino core compiles as gnu++11 by default, where a struct with
; default member initialisers is NOT an aggregate and Action{i, true} is
; rejected. Beyond the error, a firmware built to a different standard from
; firmware/CMakeLists.txt would mean the native conformance test was not
; testing the code that ships. One standard, both places.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; The thresholds are POLICY and are compiled in, not sent each tick. Kept
    ; in step with config.py by firmware/tools/export_policy.py.
    -DSOC_SHED_THRESHOLD=0.30
    -DSOC_RESTORE_THRESHOLD=0.45
    -DMIN_ACTION_DWELL_HOURS=3.0
